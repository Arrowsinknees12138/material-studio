name: material-studio
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-local}
      MYSQL_DATABASE: material_studio
      MYSQL_USER: ${DATABASE_USER:-studio}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-studio-local}
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=tcp -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" -D \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 4s
      retries: 20
    volumes:
      - database:/var/lib/mysql
  api:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:mysql://db:3306/material_studio?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      DATABASE_USER: ${DATABASE_USER:-studio}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-studio-local}
      STORAGE_PATH: /app/data
      SIMULATION_ENABLED: ${SIMULATION_ENABLED:-true}
      SIM_CHECK_MS: ${SIM_CHECK_MS:-2000}
      SIM_GENERATE_MS: ${SIM_GENERATE_MS:-5000}
      SIM_FINALIZE_MS: ${SIM_FINALIZE_MS:-2000}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 4s
      retries: 20
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - files:/app/data
  web:
    build: ./frontend
    environment:
      JAVA_API_BASE_URL: http://api:8080
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
volumes:
  database:
  files:
